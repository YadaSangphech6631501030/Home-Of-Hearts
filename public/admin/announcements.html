<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบประกาศ | Home of Hearts Residence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin-dashboard.css" />
  <link rel="stylesheet" href="/css/announcements.css" />
</head>

<body class="admin-page">
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>

  <!-- Header Section (AppBar รูปแบบเดียวกับระบบอื่น) -->
  <header class="admin-header">
    <a class="brand" href="/admin/index.html" aria-label="Home of Hearts Residence">
      <div class="brand__icon" aria-hidden="true">
        <svg viewBox="0 0 512 512" fill="currentColor">
          <path d="M261.56 10.35a25.6 25.6 0 0 0-31.12 0l-216 172.8A25.6 25.6 0 0 0 4.8 203.2v25.6A25.6 25.6 0 0 0 30.4 254.4h17.6v201.6A25.6 25.6 0 0 0 73.6 481.6h112a12.8 12.8 0 0 0 12.8-12.8v-128a38.4 38.4 0 0 1 76.8 0v128a12.8 12.8 0 0 0 12.8 12.8h112a25.6 25.6 0 0 0 25.6-25.6V254.4h17.6a25.6 25.6 0 0 0 25.6-25.6v-25.6a25.6 25.6 0 0 0-9.6-20.05z" />
        </svg>
      </div>
      <div class="brand__text">
        <div class="brand__title">Home of Hearts Residence</div>
        <div class="brand__subtitle">หอพักบ้านแห่งหัวใจ</div>
      </div>
    </a>

    <nav class="admin-nav" aria-label="เมนูหลัก">
      <a class="admin-nav__link" href="/admin/index.html">หน้าหลัก</a>
      <a class="admin-nav__link" href="/admin/contact.html">ติดต่อ</a>
      <a class="admin-nav__link" href="/admin/dormitory.html">ระบบหอพัก</a>
      <a class="admin-nav__link" href="/admin/maintenance.html">ระบบแจ้งซ่อม</a>
      <a class="admin-nav__link" href="/admin/billing.html">ระบบเงินหอพัก</a>
      <a class="admin-nav__link" href="/admin/parcels.html">ระบบพัสดุ</a>
      <a class="admin-nav__link admin-nav__link--active" href="/admin/announcements.html">ระบบประกาศ</a>
    </nav>

    <div class="admin-actions">
      <button class="icon-button" type="button" aria-label="แจ้งเตือน">
        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
          <path d="M10 21h4" />
        </svg>
      </button>

      <div class="profile-menu">
        <button class="profile-trigger" type="button" id="profile-trigger">
          <span class="profile-name" id="profile-name">สำนักงาน...</span>
          <span class="avatar" id="avatar-initials" aria-hidden="true">ส</span>
          <span class="profile-caret">⌄</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="page">
    <div class="page-header-container">
      <h2 class="page-title">ระบบประกาศ 📢</h2>
    </div>

    <!-- ปุ่มเพิ่มประกาศใหม่ -->
    <div class="action-buttons-wrapper">
      <button class="btn btn-olive" id="open-add-modal-btn" type="button">+ เพิ่มประกาศใหม่</button>
    </div>

    <!-- รายการประกาศ -->
    <div class="announcement-list" id="announcement-list-container">
      <!-- ข้อมูลจะถูก render ผ่าน JS -->
    </div>
  </main>

  <!-- Modal เพิ่มประกาศใหม่ (ตรงตามรูปภาพที่คุณแนบ) -->
  <div class="modal-overlay" id="announcement-modal">
    <div class="announcement-modal-card">
      
      <!-- Modal Header -->
      <div class="modal-top-bar">
        <div class="author-section">
          <span class="author-label">จาก</span>
          <span class="author-name">สำนักงานหอพัก<br>บ้านแห่งหัวใจ</span>
        </div>
        <div class="divider-v"></div>
        <div class="date-section">
          <span class="date-label">วัน/เดือน/ปี</span>
          <span class="date-value" id="modal-date-display">--/--/----</span>
        </div>
        <button type="button" class="close-btn" id="close-modal-btn">&times;</button>
      </div>

      <hr class="modal-divider" />

      <!-- Form Content -->
      <form id="announcement-form">
        <div class="form-row">
          <label class="form-label">หัวข้อ</label>
          <input type="text" id="announcement-title" class="input-inline" placeholder="พิมพ์ที่นี่" required />
        </div>
        
        <hr class="modal-divider light" />
    
        <div class="form-row content-row">
          <textarea id="announcement-content" class="textarea-plain" placeholder="พิมพ์ที่นี่" rows="6" required></textarea>
        </div>

        <!-- Action Footer -->
        <div class="modal-bottom-bar">
          <button type="submit" class="btn-publish">ประกาศ</button>
          <label class="btn-upload-img" title="แนบรูปภาพ">
            <input type="file" id="announcement-image" accept="image/*" hidden />
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7a8264" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
              <line x1="16" y1="19" x2="22" y2="19"></line>
              <line x1="19" y1="16" x2="19" y2="22"></line>
            </svg>
          </label>
        </div>
      </form>
    </div>
  </div>

  <!-- view announcement modal -->
   <div class="modal-overlay" id="view-announcement-modal">
    <div class="announcement-modal-card">
      <div class="modal-top-bar">
        <div class="author-section">
          <span class="author-label">จาก</span>
          <span class="author-name" id="view-modal-author">สำนักงานหอพัก<br>บ้านแห่งหัวใจ</span>
        </div>
        <div class="divider-v"></div>
        <div class="date-section">
          <span class="date-label">วัน/เดือน/ปี</span>
          <span class="date-value" id="view-modal-date">--/--/----</span>
        </div>
        <button type="button" class="close-btn" id="close-view-modal-btn">&times;</button>
      </div>

      <hr class="modal-divider" />

      <div class="view-content-wrapper">
        <div class="form-row">
          <span class="form-label">หัวข้อ</span>
          <div class="view-title" id="view-modal-title">-</div>
        </div>
        
        <hr class="modal-divider light" />

        <div class="view-body" id="view-modal-content">
        </div>
  
        <div class="view-image-container" id="view-modal-image-container" style="display: none;">
          <img id="view-modal-image" src="" alt="รูปภาพประกาศ" />
        </div>
      </div>

      <div class="modal-bottom-bar" style="justify-content: flex-end; margin-top: 24px;">
        <button type="button" class="btn-delete" id="delete-announcement-btn">ลบประกาศนี้</button>
        <button type="button" class="btn-publish" id="close-view-modal-bottom-btn">ปิด</button>
      </div>
    </div>
  </div>

  <script src="/js/admin-dashboard.js"></script>
  <script src="/js/announcements.js"></script>
</body>
</html>
