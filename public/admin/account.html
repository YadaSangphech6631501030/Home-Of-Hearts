<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>บัญชี | Home of Hearts Residence</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin-dashboard.css" />
  <link rel="stylesheet" href="/css/account.css" />
</head>

<body class="admin-page">
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>

  <!-- App Bar -->
  <header class="admin-header">
    <a class="brand" href="/admin/index.html" aria-label="Home of Hearts Residence">
      <div class="brand__icon" aria-hidden="true">
        <svg viewBox="0 0 512 512" fill="currentColor">
          <path d="M261.56 10.35a25.6 25.6 0 0 0-31.12 0l-216 172.8A25.6 25.6 0 0 0 4.8 203.2v25.6A25.6 25.6 0 0 0 30.4 254.4h17.6v201.6A25.6 25.6 0 0 0 73.6 481.6h112a12.8 12.8 0 0 0 12.8-12.8v-128a38.4 38.4 0 0 1 76.8 0v128a12.8 12.8 0 0 0 12.8 12.8h112a25.6 25.6 0 0 0 25.6-25.6V254.4h17.6a25.6 25.6 0 0 0 25.6-25.6v-25.6a25.6 25.6 0 0 0-9.6-20.05z" />
        </svg>
      </div>
      <div class="brand__text">
        <div class="brand__title">Home of Hearts Residence</div>
        <div class="brand__subtitle">หอพักบ้านแห่งหัวใจ</div>
      </div>
    </a>

    <nav class="admin-nav" aria-label="เมนูหลัก">
      <a class="admin-nav__link" href="/admin/index.html" data-nav-page="index.html">หน้าหลัก</a>
      <a class="admin-nav__link" href="/admin/contact.html" data-nav-page="contact.html">ติดต่อ</a>
      <a class="admin-nav__link" href="/admin/dormitory.html" data-nav-page="dormitory.html">ระบบหอพัก</a>
      <a class="admin-nav__link" href="/admin/maintenance.html" data-nav-page="maintenance.html">ระบบแจ้งซ่อม</a>
      <a class="admin-nav__link" href="/admin/billing.html" data-nav-page="billing.html">ระบบเงินหอพัก</a>
      <a class="admin-nav__link" href="/admin/parcels.html" data-nav-page="parcels.html">ระบบพัสดุ</a>
      <a class="admin-nav__link" href="/admin/announcements.html" data-nav-page="announcements.html">ระบบประกาศ</a>
    </nav>

    <div class="admin-actions">
      <button class="icon-button" type="button" aria-label="แจ้งเตือน">
        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
          <path d="M10 21h4" />
        </svg>
      </button>

      <!-- Profile Menu -->
      <div class="profile-menu">
        <button class="profile-trigger" type="button" id="profile-trigger" aria-expanded="false" aria-controls="profile-dropdown">
          <span class="profile-name" id="profile-name">สำนักงาน...</span>
          <span class="avatar" id="avatar-initials" aria-hidden="true">ส</span>
          <span class="profile-caret">⌄</span>
        </button>

        <div class="profile-dropdown" id="profile-dropdown" role="menu">
          <div class="profile-summary">
            <span class="avatar avatar--small" id="avatar-dropdown-initials" aria-hidden="true">ส</span>
            <span id="profile-menu-name">สำนักงานหอพัก</span>
          </div>

          <a class="profile-dropdown__item" href="/admin/account.html" role="menuitem">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="7" r="3.5"></circle>
              <path d="M5 20c0-3.866 3.134-7 7-7s7 3.134 7 7"></path>
            </svg>
            <span>บัญชี</span>
          </a>

          <button class="profile-dropdown__item" type="button" id="logout-button" role="menuitem">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>ออกจากระบบ</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Account Content -->
  <main class="dashboard-main">
    <div class="account-card-container">
      <div class="account-card">
        <h1 class="account-title">บัญชี</h1>
        
        <div class="account-avatar-wrapper">
          <div class="account-avatar-big" id="main-avatar">ส</div>
        </div>

        <form class="account-form">
          <div class="form-group">
            <label>ชื่อ</label>
            <input type="text" id="acc-name" value="" placeholder="กำลังโหลดข้อมูล..." readonly />
          </div>
          
          <div class="form-group">
            <label>เลขห้อง</label>
            <input type="text" id="acc-room" value="" readonly />
          </div>

          <div class="form-group">
            <label>เบอร์โทร</label>
            <input type="text" id="acc-phone" value="" readonly />
          </div>

          <div class="form-group">
            <label>อีเมล</label>
            <input type="email" id="acc-email" value="" readonly />
          </div>

          <div class="form-group">
            <label>รหัสผ่าน</label>
            <input type="password" id="acc-password" value="********" readonly />
          </div>
        </form>
      </div>
    </div>
  </main>
  <script src="/js/admin-dashboard.js"></script>
  <script src="/js/account.js"></script>
</body>

</html>
